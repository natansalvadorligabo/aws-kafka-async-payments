name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: make test

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        consumer: [lambda, spring]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: make up CONSUMER=${{ matrix.consumer }}
      - run: make demo CONSUMER=${{ matrix.consumer }}
      - if: always()
        run: docker compose --profile spring logs
