name: payments

services:
  localstack:
    # 4.14.0 is the last image that starts without a LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      # Lambda containers join this network so they can reach LocalStack.
      LAMBDA_DOCKER_NETWORK: payments
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - ./infra/localstack/deploy-lambda.sh:/opt/payments/deploy-lambda.sh
      - ./payments-lambda/target/payments-lambda.zip:/opt/payments/payments-lambda.zip
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # The table is the last resource the init script creates.
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name processed-payments >/dev/null"]
      interval: 3s
      retries: 40

  kafka:
    # KRaft mode (no ZooKeeper); same version as the kafka-clients Spring Boot manages.
    image: apache/kafka:4.1.2
    profiles: [kafka]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # INTERNAL for containers on the compose network, EXTERNAL for the host (tests, CLI).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics come from create-topics.sh only, so a typo cannot silently create a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/payments/create-topics.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 3s
      retries: 40

  api:
    build: payments-api
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT: http://localstack:4566
      BROKER: ${BROKER:-sqs}
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      localstack:
        condition: service_healthy

  consumer:
    build: payments-consumer
    profiles: [spring]
    environment:
      AWS_ENDPOINT: http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  dashboard:
    build: payments-dashboard
    ports:
      - "8081:8081"
    environment:
      AWS_ENDPOINT: http://localstack:4566
      API_URL: http://api:8080
      CONSUMER_URL: http://consumer:8082
      CONSUMER: ${CONSUMER:-lambda}
    depends_on:
      localstack:
        condition: service_healthy

networks:
  default:
    name: payments
