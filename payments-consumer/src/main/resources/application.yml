spring:
  application.name: payments-consumer
  cloud.aws:
    region.static: us-east-1
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    credentials:
      # LocalStack accepts any credentials; nothing here touches a real AWS account.
      access-key: test
      secret-key: test

logging.structured.format.console: ecs

# The API already uses 8080. The listener endpoint lets the dashboard stop and start consumption.
server.port: 8082
management.endpoints.web.exposure.include: health,listener

payments:
  queue: payments
  settled-topic-arn: arn:aws:sns:us-east-1:000000000000:payment-settled
  processed-table: processed-payments
