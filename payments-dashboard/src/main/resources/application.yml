server.port: 8081

spring:
  application.name: payments-dashboard
  mvc.problemdetails.enabled: true

logging.structured.format.console: ecs

payments:
  consumer: ${CONSUMER:lambda}
  broker: ${BROKER:sqs}
  kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  topic: payments
  aws-endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  api-url: ${API_URL:http://localhost:8080}
  consumer-url: ${CONSUMER_URL:http://localhost:8082}
  lambda-function: settle-payments
